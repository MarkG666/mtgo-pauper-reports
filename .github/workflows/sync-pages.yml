# Keep docs/daily (GitHub Pages) in sync with reports/daily after main updates.
# Source of truth: reports/daily/*.md — do not edit docs/daily by hand.
#
# Note: GITHUB_TOKEN pushes from Actions do NOT trigger this workflow's `push`
# event (GitHub recursion guard). Pauper daily syncs docs in-job; this workflow
# still covers human/PR pushes that touch reports/, plus a workflow_run safety
# net after Pauper daily completes.
name: Sync Pages daily docs

on:
  push:
    branches: [main]
    paths:
      - "reports/daily/**"
      - "reports/meta/**"
      - "scripts/sync_pages_daily.py"
      - ".github/workflows/sync-pages.yml"
  # Safety net: daily.yml commits with GITHUB_TOKEN never fire the push trigger.
  workflow_run:
    workflows: ["Pauper daily"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pages-docs
  cancel-in-progress: false

jobs:
  sync:
    # Skip failed daily runs; still run for push / workflow_dispatch.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out this workflow's SHA by default; use main tip.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync docs from reports
        run: python scripts/sync_pages_daily.py

      - name: Commit and push docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily docs/meta docs/index.md
          if git diff --staged --quiet; then
            echo "docs already in sync"
          else
            git commit -m "chore: sync GitHub Pages docs from reports/daily"
            git push
            echo "pushed docs sync"
          fi
