# Daily Pauper meta + Discord summary (案2)
#
# Cron is advanced ~4h vs wall intent because Actions schedule often delays ~4.5–5h
# (see docs/actions-cron-delay in project store). Expected Discord arrival:
#   US Eastern DST (EDT): cron 00:00 UTC → ~13:00–14:00 JST with ~5h delay
#   US Eastern standard (EST): cron 01:00 UTC → ~14:00–15:00 JST (Fri Challenge ends ~14:00 JST in EST)
# Crons fire at both hours; schedule_gate picks the correct cron via America/New_York.
# Gate on github.event.schedule (which cron fired), NOT runner wall-clock hour —
# delayed runners would otherwise skip forever.
# Weekly digest: Monday, same UTC hour as daily + 30 minutes (00:30 / 01:30).
name: Pauper daily

on:
  schedule:
    - cron: "0 0 * * *"       # daily candidate (EDT; expect ~13–14 JST after delay)
    - cron: "0 1 * * *"       # daily candidate (EST; expect ~14–15 JST after delay)
    - cron: "30 0 * * 1"      # Monday weekly candidate (+30m after EDT daily)
    - cron: "30 1 * * 1"      # Monday weekly candidate (+30m after EST daily)
  workflow_dispatch:
    inputs:
      post_weekly:
        description: "Also post weekly digest to Discord"
        type: boolean
        default: false
      skip_ingest:
        description: "Skip run-daily (summary/post only; uses existing DB)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pauper-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: DST schedule gate
        id: gate
        env:
          PYTHONPATH: src
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          FORCE=0
          KIND=daily
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE=1
          fi
          case "$SCHEDULE" in
            "30 0 * * 1"|"30 1 * * 1") KIND=weekly ;;
          esac
          if [ "$FORCE" = "1" ]; then
            python -m pauper_meta.schedule_gate --kind "$KIND" --schedule "$SCHEDULE" --force
          else
            python -m pauper_meta.schedule_gate --kind "$KIND" --schedule "$SCHEDULE"
          fi
          echo "Gate schedule='$SCHEDULE' kind=$KIND force=$FORCE"

      - name: Detect job mode
        id: mode
        env:
          GATE_RUN: ${{ steps.gate.outputs.should_run }}
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          WEEKLY=0
          DAILY=1
          # Wrong DST hour → no-op success (both 00:00 and 01:00 fire daily)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$GATE_RUN" != "1" ]; then
            echo "Skipping: DST gate said should_run=$GATE_RUN for schedule='$SCHEDULE'"
            echo "run_daily=0" >> "$GITHUB_OUTPUT"
            echo "run_weekly=0" >> "$GITHUB_OUTPUT"
            echo "skipped_dst=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "30 0 * * 1"|"30 1 * * 1")
              WEEKLY=1
              # Monday weekly slot: digest only (daily already ran at :00)
              DAILY=0
              ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAILY=1
            if [ "${{ inputs.post_weekly }}" = "true" ]; then
              WEEKLY=1
            fi
            if [ "${{ inputs.skip_ingest }}" = "true" ]; then
              DAILY=0
            fi
          fi
          echo "run_daily=$DAILY" >> "$GITHUB_OUTPUT"
          echo "run_weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "skipped_dst=0" >> "$GITHUB_OUTPUT"
          echo "Detected run_daily=$DAILY run_weekly=$WEEKLY schedule='$SCHEDULE' gate=$GATE_RUN"

      - name: Run daily ingest + report (+ yesterday catch-up)
        id: daily
        if: steps.mode.outputs.run_daily == '1'
        env:
          PYTHONPATH: src
        run: python -m pauper_meta run-daily

      # Lookback HTML flakes (old events) make run-daily exit 2 AFTER writing today's
      # report. Still commit + Discord so a partial lookback miss cannot block delivery.
      - name: Commit DB and reports
        if: >-
          always() &&
          steps.mode.outputs.run_daily == '1' &&
          (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pauper.sqlite reports/ data/discord_posted.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily pauper update $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed DB + reports"
          fi

      - name: Discord daily summary (today + recent unposted; deduped)
        if: >-
          always() &&
          steps.mode.outputs.run_daily == '1' &&
          (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        env:
          PYTHONPATH: src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # today, yesterday, and day-before (covers evening Challenges that land
          # after the 13:00 JST post, and one delayed catch-up window)
          mapfile -t DATES < <(python -c "
          from datetime import timedelta
          from pauper_meta.report_daily import today_jst
          t = today_jst()
          for i in range(3):
              print((t - timedelta(days=i)).isoformat())
          ")
          post_one() {
            local DATE="$1"
            local OUT="/tmp/discord-daily-$DATE.txt"
            if [ -z "$DISCORD_WEBHOOK_URL" ]; then
              echo "::warning::DISCORD_WEBHOOK_URL secret is not set — skipping Discord post for $DATE"
              python -m pauper_meta discord-summary --mode daily --date "$DATE" --out "$OUT"
            else
              python -m pauper_meta discord-summary --mode daily --date "$DATE" --post --out "$OUT"
            fi
            echo "----- daily summary $DATE -----"
            cat "$OUT"
          }
          for DATE in "${DATES[@]}"; do
            post_one "$DATE"
          done

      - name: Discord weekly digest
        if: steps.mode.outputs.run_weekly == '1'
        env:
          PYTHONPATH: src
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set — skipping weekly Discord post (job continues)"
            python -m pauper_meta discord-summary --mode weekly --out /tmp/discord-weekly.txt
          else
            python -m pauper_meta discord-summary --mode weekly --post --out /tmp/discord-weekly.txt
          fi
          echo "----- weekly summary -----"
          cat /tmp/discord-weekly.txt

      - name: Commit Discord posted tracker
        if: >-
          always() &&
          (
            (
              steps.mode.outputs.run_daily == '1' &&
              (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
            ) ||
            steps.mode.outputs.run_weekly == '1'
          )
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discord_posted.json
          if git diff --staged --quiet; then
            echo "No discord_posted.json changes"
          else
            # Re-pull in case the earlier push raced; keep ours for tracker
            git pull --rebase --autostash origin main || true
            git commit -m "chore: discord posted tracker $(date -u +%Y-%m-%d)" || true
            git push || echo "::warning::push discord tracker failed (non-fatal)"
          fi
