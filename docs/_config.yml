title: MTGO Pauper Reports
description: Magic Online Pauper Challenge / Preliminary 日次レポート
lang: ja
timezone: Asia/Tokyo

# Project Pages URL: https://markg666.github.io/mtgo-pauper-reports/
url: "https://markg666.github.io"
baseurl: "/mtgo-pauper-reports"

markdown: kramdown
kramdown:
