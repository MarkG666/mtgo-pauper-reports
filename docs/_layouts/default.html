<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="site-tag">Pauper Challenge / Preliminary 日次レポート</p>
    </div>
  </header>
  <main class="wrap">
    {% if page.title %}
    <h1>{{ page.title }}</h1>
    {% endif %}
    {{ content }}
  </main>
  <footer class="site-footer wrap">
    <p>
      出典:
      <a href="https://github.com/MarkG666/mtgo-pauper-reports">MarkG666/mtgo-pauper-reports</a>
      （<code>reports/daily/</code>）
    </p>
  </footer>
</body>
</html>
