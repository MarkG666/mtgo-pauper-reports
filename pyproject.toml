[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pauper-meta"
version = "0.1.0"
description = "MTGO Pauper Challenge/Preliminary daily meta tracker (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0,<3",
  "tzdata>=2024.1",
]

[project.scripts]
pauper-meta = "pauper_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
